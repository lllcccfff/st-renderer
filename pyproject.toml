[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-renderer"
version = "0.1.0"
description = "StreetWorld Fast Gauss renderer"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "PyYAML", "plyfile"]

[tool.setuptools.packages.find]
where = ["src"]
